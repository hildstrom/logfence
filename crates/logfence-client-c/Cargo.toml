[package]
name = "logfence-client-c"
description = "C API wrapper for the logfence-client library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
# rlib is required for use as a Rust dependency (e.g. integration tests).
# cdylib and staticlib produce the artifacts for C consumers.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
logfence-proto  = { workspace = true }
logfence-client = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true }

# This crate does NOT inherit [workspace.lints] because it is the FFI boundary
# and requires unsafe code for raw pointer operations. All other workspace lint
# policies are reproduced here.
[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic               = { level = "warn", priority = -1 }
unwrap_used            = "deny"
expect_used            = "warn"
panic                  = "deny"
panic_in_result_fn     = "deny"
unimplemented          = "deny"
allow_attributes_without_reason = "warn"
dbg_macro              = "deny"
todo                   = "deny"
print_stdout           = "deny"
print_stderr           = "deny"
await_holding_lock     = "deny"
large_futures          = "deny"
exit                   = "deny"
mem_forget             = "deny"
module_name_repetitions = "allow"
similar_names          = "allow"
